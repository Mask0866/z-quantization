name = "z-quantization"
pages_build_output_dir = "frontend"
compatibility_date = "2024-01-01"

# D1 数据库配置
[[d1_databases]]
binding = "DB"
database_name = "z-quantization-db"
database_id = "85bb49b5-fbf7-4bdf-8abd-d7346e07ceae"

# 环境变量
[vars]
CUSTOM_DOMAIN = "luo798.ccwu.cc"
API_VERSION = "v1"

# 定时爬取触发器（与设计文档调度一致：05:00 系统清理 / 15:30 收盘后 / 18:30 净值公布后）
[triggers]
crons = ["0 5 * * *", "30 15 * * *", "30 18 * * *"]
